[project]
name = "nexus-vision"
version = "0.1.0"
description = "Nexus vision pipeline - local PDF text/OCR/table extraction"
# Deliberately NOT a member of the root uv workspace (../../pyproject.toml).
# paddlepaddle currently ships wheels up to cp313 only, while the workspace's
# shared .venv resolves to whatever newest interpreter satisfies its own
# `requires-python` (3.14 at the time this was written). Joining the
# workspace would force every other service's lockfile to solve around
# paddlepaddle's ceiling. This project gets its own venv instead, pinned via
# .python-version.
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.0.0",
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.7.0",
    # PP-StructureV3 (layout + table recognition) needs paddlex's optional
    # "ocr" extra; the base paddleocr install alone raises a DependencyError
    # at pipeline construction time.
    "paddlex[ocr]>=3.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]

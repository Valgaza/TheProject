[project]
name = "nexus-runtime"
version = "0.1.0"
description = "Nexus runtime – every local model on MLX, behind one OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # Apple-silicon inference. mlx-lm runs the chat model, mlx-embeddings the
    # embedding model; xgrammar turns a JSON schema into a token mask so
    # graphiti's structured extraction cannot come back malformed.
    "mlx>=0.32.0",
    "mlx-lm>=0.32.0",
    "mlx-embeddings>=0.1.0",
    "xgrammar>=0.2.8",
    # The decision model (Laya) on MLX: typed yes/no and choice questions in
    # one forward pass, for the decisions core no longer spends an LLM call on.
    "laya-mlx>=0.3.0",
    # Voice. Parakeet (speech to text) and Kokoro (text to speech) on MLX;
    # misaki is Kokoro's text-to-phoneme step and needs spaCy's small English
    # model, which is not on PyPI.
    "parakeet-mlx>=0.5.3",
    "mlx-audio>=0.5.7",
    "misaki[en]>=0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_runtime"]

[tool.hatch.metadata]
# spaCy's English model is only distributed as a wheel on GitHub.
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "nexus-memory"
version = "0.1.0"
description = "Nexus memory service – knowledge graph API backed by Neo4j and graphiti-core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Pinned, not floated. The retrieval layer works around specific 0.29
    # behaviour: search() mutating a shared recipe, add_episode's `uuid` meaning
    # "update", episode_metadata being declared but never persisted, and node
    # summaries replacing rather than accumulating. A minor bump could change
    # any of those silently.
    "graphiti-core==0.29.0",
    "neo4j>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_memory"]

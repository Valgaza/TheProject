[project]
name = "nexus-memory"
version = "0.1.0"
description = "Nexus memory service – knowledge graph API backed by Neo4j and graphiti-core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "graphiti-core[groq]>=0.3.22",
    "neo4j>=5.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production-grade RAG pipeline with Qdrant hybrid search, cross-encoder reranking, and LLM-agnostic context assembly"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client[fastembed]>=1.12.0",
    "pymupdf4llm>=0.0.17",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
rag = "rag_pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["rag_pipeline*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "nexus"
version = "0.1.0"
description = "Nexus – local multi-pipeline AI orchestration system"
requires-python = ">=3.12"
# The two services are workspace members, depended on here so `uv sync` installs
# both editable. Without this the members were only installed incidentally, and
# a sync would quietly uninstall them.
dependencies = [
    "nexus-core",
    "nexus-memory",
    "rag-pipeline",
    "nexus-runtime",
    "nexus-websearch",
]

[tool.uv]
# pipecat-ai (core's voice pipeline) pins these to older releases than the
# rest of the workspace was built and benchmarked on. Its Silero VAD, Smart
# Turn model and WebRTC transport were checked against the newer ones
# (2026-10-07), so the workspace keeps them rather than downgrading RAG's
# embeddings and the runtime's audio stack for one dependency.
override-dependencies = [
    "onnxruntime>=1.29",
    "protobuf>=7",
    "soundfile>=0.14",
    "soxr>=1.1",
]

[tool.uv.workspace]
members = ["memory", "core", "rag", "runtime", "websearch"]

[tool.uv.sources]
nexus-core = { workspace = true }
nexus-memory = { workspace = true }
rag-pipeline = { workspace = true }
nexus-runtime = { workspace = true }
nexus-websearch = { workspace = true }

[dependency-groups]
dev = [
    "psutil>=7",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `tests/` holds the end-to-end scenarios. They skip themselves unless
# RUN_SCENARIOS=1, so the default run stays fast and free.
# rag/tests joined the default run on 2026-09-03. It costs ~17s -- it loads a
# real embedding model and a real cross-encoder -- against ~3s for everything
# else, and that is worth paying: rag/tests/test_scopes.py is where the
# document isolation guarantee lives, and a guarantee nobody runs is a
# guarantee that quietly stops holding. The slow part is model loading, not
# the assertions.
testpaths = ["core/tests", "memory/tests", "rag/tests", "runtime/tests", "websearch/tests", "tests"]
# No pythonpath: both services are installed as distinct top-level packages
# (nexus_core, nexus_memory). They used to both be called `app`, which meant
# `import app` resolved to whichever .pth file won and left the memory service
# unimportable by name from anywhere outside memory/.

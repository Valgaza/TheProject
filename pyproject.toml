[project]
name = "nexus"
version = "0.1.0"
description = "Nexus – local multi-pipeline AI orchestration system"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["memory", "core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

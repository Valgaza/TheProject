[project]
name = "nexus-websearch"
version = "0.1.0"
description = "Nexus web search – the one component allowed to reach the internet, with redaction and an audit log"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_websearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project]
name = "nexus-core"
version = "0.1.0"
description = "Nexus core service – chat, orchestration, and the model provider layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    # Auth (added 2026-09-02): bcrypt hashes passwords, pyjwt issues/verifies
    # session tokens, authlib is the Starlette/FastAPI-native OAuth client
    # (the Python equivalent of Node's Passport — Passport itself only
    # plugs into Express/Node, it has no meaning in a Python service).
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
    "authlib>=1.3.0",
    "pydantic[email]>=2.0.0",
    # Starlette's SessionMiddleware (Authlib's OAuth state storage) needs
    # this to sign its own cookie — not a direct import anywhere of ours.
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280"/>
  <title>Nexus — local-first AI orchestration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="tokens.css"/>
  <link rel="stylesheet" href="app.css"/>
  <link rel="stylesheet" href="landing.css"/>
  <link rel="stylesheet" href="pages.css"/>
  <link rel="stylesheet" href="graph.css"/>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="chat-home.jsx"></script>
  <script type="text/babel" src="conversation.jsx"></script>
  <script type="text/babel" src="projects.jsx"></script>
  <script type="text/babel" src="graph.jsx"></script>
  <script type="text/babel" src="settings.jsx"></script>

  <script type="text/babel">
    /* Default tweaks (persisted by host) */
    const TWEAKS = /*EDITMODE-BEGIN*/{
      "accent": "teal",
      "fontPairing": "fraunces_inter",
      "heroBackground": "particles",
      "animationIntensity": "restrained"
    }/*EDITMODE-END*/;

    const ACCENTS = {
      teal:     { primary: "0.42 0.060 195", deep: "0.32 0.055 200", soft: "0.78 0.040 195", veil: "0.94 0.020 195", ink: "0.16 0.030 215", line: "0.86 0.025 195" },
      gold:     { primary: "0.66 0.075 78",  deep: "0.55 0.075 70",  soft: "0.85 0.050 80",  veil: "0.95 0.025 80",  ink: "0.30 0.060 60",  line: "0.88 0.030 78" },
      copper:   { primary: "0.55 0.090 45",  deep: "0.44 0.085 40",  soft: "0.80 0.060 50",  veil: "0.95 0.025 50",  ink: "0.26 0.070 30",  line: "0.86 0.035 45" },
      slate:    { primary: "0.36 0.045 250", deep: "0.26 0.045 250", soft: "0.74 0.035 250", veil: "0.94 0.018 250", ink: "0.16 0.030 250", line: "0.86 0.025 250" },
    };
    const FONTS = {
      fraunces_inter: { display: '"Fraunces", "GT Sectra", Georgia, serif', sans: '"Inter Tight", "Söhne", system-ui, sans-serif' },
      sectra_inter:   { display: '"Fraunces", Georgia, serif',              sans: '"Inter Tight", system-ui, sans-serif' },
      editorial:      { display: '"Fraunces", Georgia, serif',              sans: '"Inter Tight", system-ui, sans-serif' },
      neue_tiempos:   { display: '"Inter Tight", system-ui, sans-serif',    sans: '"Fraunces", Georgia, serif' },
      sohne_only:     { display: '"Inter Tight", system-ui, sans-serif',    sans: '"Inter Tight", system-ui, sans-serif' },
    };

    const applyTweaks = (t) => {
      const r = document.documentElement;
      const a = ACCENTS[t.accent] || ACCENTS.teal;
      r.style.setProperty("--accent",      `oklch(${a.primary})`);
      r.style.setProperty("--accent-deep", `oklch(${a.deep})`);
      r.style.setProperty("--accent-soft", `oklch(${a.soft})`);
      r.style.setProperty("--accent-veil", `oklch(${a.veil})`);
      r.style.setProperty("--accent-ink",  `oklch(${a.ink})`);
      const f = FONTS[t.fontPairing] || FONTS.fraunces_inter;
      r.style.setProperty("--font-display", f.display);
      r.style.setProperty("--font-sans",    f.sans);
    };

    const App = () => {
      const [page, setPage] = React.useState("landing");
      const [tweaks, setTweak] = (window.useTweaks ? window.useTweaks(TWEAKS) : [TWEAKS, () => {}]);

      React.useEffect(() => { applyTweaks(tweaks); }, [tweaks]);
      React.useEffect(() => { window.scrollTo(0, 0); }, [page]);

      const isLanding = page === "landing";

      return (
        <div className={`app ${isLanding ? "is-landing" : ""}`}>
          {!isLanding && <RailNav page={page} setPage={setPage}/>}
          <main className="main">
            {!isLanding && <TopBar page={page} setPage={setPage}/>}
            <div className="page" key={page} style={{
              animation: "pageIn 480ms cubic-bezier(0.16, 1, 0.3, 1)"
            }}>
              {page === "landing" && <Landing setPage={setPage} hero={tweaks.heroBackground} intensity={tweaks.animationIntensity === "showcase" ? 1.4 : tweaks.animationIntensity === "restrained" ? 0.5 : 1}/>}
              {page === "chat" && <ChatHome setPage={setPage}/>}
              {page === "conversation" && <Conversation setPage={setPage}/>}
              {page === "projects" && <Projects setPage={setPage}/>}
              {page === "graph" && <Graph/>}
              {page === "settings" && <Settings/>}
            </div>
          </main>

          {window.TweaksPanel && (
            <TweaksPanel title="Tweaks">
              <TweakSection title="Accent">
                <TweakRadio
                  label="Color"
                  value={tweaks.accent}
                  onChange={v => setTweak("accent", v)}
                  options={[
                    { value: "teal",   label: "Teal" },
                    { value: "gold",   label: "Gold" },
                    { value: "copper", label: "Copper" },
                    { value: "slate",  label: "Slate" },
                  ]}/>
              </TweakSection>
              <TweakSection title="Typography">
                <TweakSelect
                  label="Pairing"
                  value={tweaks.fontPairing}
                  onChange={v => setTweak("fontPairing", v)}
                  options={[
                    { value: "fraunces_inter", label: "Fraunces × Inter Tight" },
                    { value: "sectra_inter",   label: "Sectra-style × Inter" },
                    { value: "editorial",      label: "Editorial × Inter" },
                    { value: "neue_tiempos",   label: "Sans display × Serif body" },
                    { value: "sohne_only",     label: "Söhne-style sans only" },
                  ]}/>
              </TweakSection>
              <TweakSection title="Hero background">
                <TweakRadio
                  label="Style"
                  value={tweaks.heroBackground}
                  onChange={v => setTweak("heroBackground", v)}
                  options={[
                    { value: "particles", label: "Particles" },
                    { value: "mesh",      label: "Mesh"      },
                    { value: "drift",     label: "Drift"     },
                    { value: "topo",      label: "Topo"      },
                  ]}/>
              </TweakSection>
              <TweakSection title="Motion">
                <TweakRadio
                  label="Intensity"
                  value={tweaks.animationIntensity}
                  onChange={v => setTweak("animationIntensity", v)}
                  options={[
                    { value: "restrained", label: "Restrained" },
                    { value: "generous",   label: "Generous"   },
                    { value: "showcase",   label: "Showcase"   },
                  ]}/>
              </TweakSection>
              <TweakButton onClick={() => setPage("landing")}>↳ Back to landing</TweakButton>
            </TweaksPanel>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>

  <style>
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</body>
</html>

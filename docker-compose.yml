# All of Nexus's infrastructure, in one file.
#
# Databases and third-party services run in containers; the application code
# (core, memory, the RAG API, the frontend) still runs directly on the host
# during development, so editing a line doesn't mean rebuilding an image.
# Dockerfiles for those come later, when we deploy to EC2.
#
# Merged 2026-09-02 from three separate compose files (root/Neo4j,
# RAG's Qdrant, web search's SearXNG) so one `docker compose up -d` starts
# everything, and so this file is close to what actually gets deployed.
#
# ⚠️  `docker compose down -v` now deletes EVERY volume below — your graph,
#     your vectors and your chat history, all at once. To reset just one
#     database, see the targeted commands in README.md.

services:
  # ── Postgres: what was said ──────────────────────────────────────────────
  # Chat transcripts — every message, always. Replaces the Supabase CLI's
  # local stack: that started twelve containers (Auth, Storage, Realtime,
  # Studio, an email catcher...) of which this project uses exactly one.
  # The schema itself is plain Postgres, no Supabase-specific roles or
  # policies, so it applies here unchanged.
  postgres:
    image: postgres:17
    container_name: nexus-postgres
    ports:
      # Host 54322, not the usual 5432. Two reasons: it matches the
      # DATABASE_URL already in .env.example (so no config changes anywhere),
      # and it can't collide with a normal Postgres you install later.
      - "54322:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounted read-only and applied by the init script below. db/ is the
      # source of truth for the schema.
      - ./db/migrations:/migrations:ro
      - ./db/seed.sql:/seed.sql:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Neo4j: what was learned ──────────────────────────────────────────────
  # The knowledge graph. Browser UI on 7474, bolt protocol on 7687.
  neo4j:
    image: neo4j:5.26-community
    container_name: nexus-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-nexus-local}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Capped: left alone, Neo4j sizes its heap and page cache from the
      # container's memory and grew to ~850 MB on a graph of a few hundred
      # nodes. On a 24 GB machine where the language model needs every spare
      # gigabyte, the database gets a fixed, small share. Plenty for a
      # personal graph; raise both if one ever grows into the millions.
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "256m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Qdrant: the document vectors ─────────────────────────────────────────
  # Backs rag/rag_pipeline. Moved here from rag/docker-compose.yml.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexus-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      # The qdrant image ships no curl, wget, nc or python — the curl-based
      # check inherited from rag/docker-compose.yml always failed, so the
      # container sat "unhealthy" while serving requests perfectly well.
      # bash IS present, and its /dev/tcp is a builtin rather than a program,
      # so this speaks HTTP with no external tools at all.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q passed <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SearXNG: private web search ──────────────────────────────────────────
  # Self-hosted metasearch, so web queries never reach a third-party search
  # API. Called only by core/nexus_core/web_client.py, and only when the
  # person asks for a web search (the composer's web button, or saying so).
  # The one deliberate exception to everything else here working offline,
  # which is why the query is redacted before it is sent.
  searxng:
    image: searxng/searxng:latest
    container_name: nexus-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped
    mem_limit: 256m

volumes:
  postgres_data:
    name: nexus_postgres_data
  neo4j_data:
    name: nexus_neo4j_data
  neo4j_logs:
    name: nexus_neo4j_logs
  qdrant_storage:
    # Renamed from rag_qdrant_storage (the old rag/docker-compose.yml name)
    # once that volume was confirmed empty — nothing to preserve, and the
    # old name kept triggering a "created for project rag" warning.
    name: nexus_qdrant_storage
